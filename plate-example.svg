<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
<defs>
<radialGradient id="spot" cx="50%" cy="85%" r="55%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#222"/></radialGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/></linearGradient>
<linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#aaa"/><stop offset="1" stop-color="#333"/></linearGradient>
</defs>
<rect width="1280" height="800" fill="#1a1a1a"/>
<polygon points="560,0 720,0 1000,800 280,800" fill="url(#beam)"/>
<ellipse cx="640" cy="720" rx="380" ry="60" fill="#ddd"/>
<!-- office chair -->
<rect x="560" y="330" width="160" height="210" rx="30" fill="#2b2b2b"/>
<rect x="540" y="530" width="200" height="50" rx="20" fill="#3a3a3a"/>
<rect x="630" y="580" width="20" height="90" fill="#555"/>
<path d="M560 700 L640 665 L720 700" stroke="#555" stroke-width="14" fill="none"/>
<!-- jacket on chair -->
<path d="M575 340 Q640 300 705 340 L700 520 L580 520 Z" fill="#111"/>
<path d="M640 330 L615 430 L640 470 L665 430 Z" fill="#666"/>
<!-- chip -->
<g transform="translate(150,470)"><rect width="230" height="230" rx="10" fill="url(#chip)"/><rect x="45" y="45" width="140" height="140" fill="#888"/>
<g stroke="#bbb" stroke-width="8">
<line x1="20" y1="-20" x2="20" y2="0"/><line x1="60" y1="-20" x2="60" y2="0"/><line x1="100" y1="-20" x2="100" y2="0"/><line x1="140" y1="-20" x2="140" y2="0"/><line x1="180" y1="-20" x2="180" y2="0"/><line x1="210" y1="-20" x2="210" y2="0"/>
<line x1="250" y1="20" x2="230" y2="20"/><line x1="250" y1="60" x2="230" y2="60"/><line x1="250" y1="100" x2="230" y2="100"/><line x1="250" y1="140" x2="230" y2="140"/><line x1="250" y1="180" x2="230" y2="180"/></g></g>
<!-- rising arrow -->
<polyline points="860,640 960,560 1030,600 1160,420" stroke="#eee" stroke-width="22" fill="none" stroke-linejoin="round"/>
<polygon points="1190,380 1120,410 1170,460" fill="#eee"/>
</svg>
