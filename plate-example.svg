<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
<!-- Example plate drawing for "Nvidia reinstates Jensen Huang as CEO".
     Rules: a big LABEL BANNER saying in plain words what the story is (company + what happened),
     one clear focal object, strong black/white contrast, chunky shapes (dots blur thin lines),
     no real faces, no logos. -->
<defs>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".25"/></linearGradient>
</defs>
<rect width="1280" height="800" fill="#141414"/>
<!-- LABEL BANNER: the most important part -->
<rect x="0" y="0" width="1280" height="170" fill="#fff"/>
<text x="640" y="112" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="96" fill="#000">NVIDIA CEO IS BACK</text>
<!-- spotlight -->
<polygon points="560,170 720,170 980,800 300,800" fill="url(#beam)"/>
<ellipse cx="640" cy="715" rx="250" ry="45" fill="#e8e8e8"/>
<!-- the CEO's chair with name plate -->
<rect x="545" y="300" width="190" height="240" rx="34" fill="#000"/>
<rect x="520" y="530" width="240" height="56" rx="22" fill="#000"/>
<rect x="628" y="586" width="24" height="90" fill="#000"/>
<path d="M545 705 L640 668 L735 705" stroke="#000" stroke-width="20" fill="none"/>
<!-- leather jacket hung on chair -->
<path d="M560 312 Q640 275 720 312 L712 520 L568 520 Z" fill="#2a2a2a"/>
<path d="M640 300 L612 420 L640 470 L668 420 Z" fill="#fff"/>
<!-- name plate -->
<rect x="470" y="610" width="340" height="70" fill="#fff" stroke="#000" stroke-width="6"/>
<text x="640" y="660" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="42" fill="#000">CEO</text>
<!-- AI chip, labelled -->
<g transform="translate(110,430)">
<rect width="250" height="250" rx="14" fill="#fff"/>
<rect x="45" y="45" width="160" height="160" fill="#000"/>
<text x="125" y="140" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" fill="#fff">AI</text>
<g stroke="#fff" stroke-width="14"><line x1="30" y1="-30" x2="30" y2="0"/><line x1="90" y1="-30" x2="90" y2="0"/><line x1="160" y1="-30" x2="160" y2="0"/><line x1="220" y1="-30" x2="220" y2="0"/></g>
</g>
<!-- stock up arrow, labelled -->
<polyline points="900,660 990,580 1050,620 1170,430" stroke="#fff" stroke-width="30" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1205,385 1120,420 1180,480" fill="#fff"/>
<rect x="885" y="690" width="360" height="80" fill="#000"/>
<text x="1065" y="750" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="54" fill="#fff">STOCK +33%</text>
</svg>
